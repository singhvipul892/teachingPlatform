# LOCAL STACK ONLY (docker-compose.local.yml). Same routing as
# nginx/nginx.no-ssl.conf: static pages under /web/, everything else to the API,
# so the admin panel talks to the local API from the same origin.

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100m;

    location = / {
        return 302 /web/auth/login.html;
    }

    location = /policies.html {
        return 301 /web/student/policies.html;
    }

    location /web/ {
        alias /usr/share/nginx/html/web/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        proxy_pass         http://api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
